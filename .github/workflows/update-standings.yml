name: Update Premier League standings and fixtures

on:
  # GitHub cron runs in UTC and usually starts ~3h late on this repo.
  # PL matches end by ~06:00 JST; the evening run picks up Saturday's early
  # kick-off and results football-data.org published late.
  schedule:
    - cron: "13 21 * * *" # 06:13 JST
    - cron: "13 12 * * *" # 21:13 JST
  workflow_dispatch:

# Needed to push the regenerated SVG back to the repository.
permissions:
  contents: write

# Never let two runs race on the same branch.
concurrency:
  group: update-standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate standings SVG
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: node scripts/generate-standings.mjs

      - name: Generate fixtures SVG
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: node scripts/generate-fixtures.mjs

      - name: Commit when the table actually changed
        run: |
          set -euo pipefail
          if git diff --quiet -- assets; then
            echo "Assets unchanged. Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: update Premier League assets"
          # A push from outside this workflow can land between checkout and
          # here, which would make a plain `git push` fail as non-fast-forward.
          # Merge the fresher main and, on a conflict, keep this run's assets:
          # they were rendered from the API moments ago. Other people's
          # changes merge in untouched.
          git fetch origin main
          git merge --no-edit -X ours origin/main
          git push
